<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>C. Abdul Hakeem College of Engineering &amp; Technology</title>

    <!-- Google Fonts (Montserrat & Merriweather) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Merriweather:ital,wght@0,300;0,400;1,300;1,400&family=Montserrat:wght@300;400;500;600;700;800;900&display=swap"
        rel="stylesheet">

    <!-- CSS Stylesheet -->
    <link rel="stylesheet" href="welcome.css">
</head>

<body>

    <!-- Background Media Layer (CAHCET Campus Building Image) -->
    <div class="welcome-bg-media">
        <img src="assets/hero-img.jpeg" alt="C. Abdul Hakeem College of Engineering &amp; Technology Campus" class="welcome-bg-img">
        <div class="welcome-overlay"></div>
    </div>

    <!-- Centered Main Content Wrapper -->
    <main class="welcome-screen">
        <div class="welcome-container">

            <!-- Institutional Logo -->
            <div class="welcome-logo-wrap animate-item delay-1">
                <img src="college-logo-ictata (1).png" alt="CAHCET Institutional Logo" class="welcome-logo">
            </div>

            <!-- Subtle Gold Accent Line -->
            <div class="welcome-accent-line animate-item delay-1" aria-hidden="true"></div>

            <!-- Eyebrow -->
            <span class="welcome-eyebrow animate-item delay-2">WELCOME TO</span>

            <!-- Main Heading / College Name -->
            <h1 class="welcome-title animate-item delay-3" id="welcomeTitle">
                C. ABDUL HAKEEM COLLEGE OF<br>
                <span class="welcome-title-highlight">ENGINEERING AND TECHNOLOGY</span>
            </h1>

            <!-- Tagline -->
            <p class="welcome-tagline animate-item delay-4">
                &ldquo;Enter to Learn, Leave to Serve&rdquo;
            </p>

            <!-- Explore Button -->
            <div class="welcome-action animate-item delay-5">
                <a href="index.html" class="explore-btn" aria-label="Explore CAHCET Official Website">
                    <span>EXPLORE</span>
                </a>
            </div>

        </div>
    </main>

    <!-- JavaScript -->
    <script src="welcome.js"></script>

</body>

</html>
